:root {
  --bg: #FBF3EA;
  --surface: #FFFFFF;
  --fg: #2B1E1A;
  --muted: #7A6560;
  --line: #EADBCD;
  --coral: #E2654F;
  --coral-ink: #FFF7EE;
  --focus: #2B1E1A;
  --display: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1513; --surface: #261D1A; --fg: #F6EADF; --muted: #B59E95;
    --line: #3D302B; --coral: #EE7A63; --coral-ink: #1C1513; --focus: #F6EADF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1513; --surface: #261D1A; --fg: #F6EADF; --muted: #B59E95;
  --line: #3D302B; --coral: #EE7A63; --coral-ink: #1C1513; --focus: #F6EADF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
  display: grid; gap: 28px;
}

/* Kopf */
header { display: grid; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.page-logo { display: block; width: 160px; height: auto; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
.lang button {
  font: inherit; font-weight: 700; font-size: 13px; letter-spacing: .06em; cursor: pointer;
  border: 0; background: transparent; color: var(--muted);
  min-width: 46px; min-height: 38px; border-radius: 999px; padding: 0 12px;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.kicker {
  font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--coral);
}
h1 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(34px, 7vw, 64px); line-height: .98; margin: 0;
  text-wrap: balance; letter-spacing: -.035em;
}
.intro { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16px; }

.steps {
  list-style: none; margin: 6px 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
}
.steps li {
  border-top: 3px solid var(--coral); padding-top: 10px;
  display: grid; gap: 2px; min-width: 0; align-content: start;
}
.steps b { font-family: var(--display); font-weight: 700; font-size: 15px; }
.steps li > span { color: var(--muted); font-size: 13.5px; }
.steps .n { color: var(--coral); margin-right: 6px; }

.code {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.code .code-lbl { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.code code {
  font-family: var(--display); font-weight: 800; font-size: clamp(18px, 5.4vw, 24px); letter-spacing: -.01em;
  color: var(--coral); overflow-wrap: anywhere; min-width: 0; flex: 1 1 auto;
}

/* Hauptbereich */
main {
  display: grid; gap: 32px;
  grid-template-columns: minmax(0, 1fr) 340px; align-items: start;
}
form { display: grid; gap: 22px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend, label.lbl {
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); padding: 0; margin-bottom: 2px;
}
.hint { font-size: 13px; color: var(--muted); margin: 0; }
input[type="text"], input[type="number"] {
  width: 100%; font: inherit; font-size: 16px; color: var(--fg);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 11px 12px; min-height: 46px;
}
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input:focus-visible, button:focus-visible, .chip input:focus-visible + span, .sw input:focus-visible + span {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.nums.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.num { display: grid; gap: 6px; min-width: 0; align-content: start; }
.num label { display: grid; line-height: 1.25; }
.num label b { font-family: var(--display); font-weight: 800; font-size: 16px; }
.num label span { font-size: 12.5px; color: var(--muted); }
.stepper {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: stretch;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden;
}
.stepper:focus-within { border-color: var(--fg); }
.stepper button {
  font: inherit; font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer;
  border: 0; background: transparent; color: var(--fg); min-height: 48px; touch-action: manipulation;
}
.stepper button:active { background: var(--line); }
.stepper input {
  border: 0; border-radius: 0; background: transparent; text-align: center; padding: 6px 0; min-height: 48px;
  font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums;
}
.stepper input:focus-visible { outline: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
input[type="range"] { width: 100%; height: 44px; margin: 0; accent-color: var(--coral); cursor: pointer; }
label.lbl output { color: var(--coral); margin-left: 6px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.chip input, .sw input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: inline-flex; align-items: center; min-height: 42px; padding: 8px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
  font-size: 14px; font-weight: 500;
}
.chip input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip { position: relative; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw { position: relative; }
.sw span {
  display: block; width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
  border: 3px solid var(--bg); box-shadow: 0 0 0 1.5px var(--line);
}
.sw input:checked + span { box-shadow: 0 0 0 2.5px var(--fg); }
.custom-color { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.custom-color input { width: 42px; height: 42px; border: 0; padding: 0; background: none; cursor: pointer; }

.upload { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-align: center;
  border-radius: 999px; padding: 12px 20px; min-height: 48px; border: 1.5px solid var(--fg);
  background: transparent; color: var(--fg); touch-action: manipulation;
}
.btn.primary { background: var(--coral); border-color: var(--coral); color: var(--coral-ink); }
.btn.small { padding: 8px 14px; font-size: 14px; min-height: 42px; }
.btn:disabled { opacity: .5; cursor: default; }
label.btn { display: inline-flex; align-items: center; justify-content: center; }
.file-name { font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; flex: 1 1 200px; }

/* Vorschau */
.preview {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
  display: grid; gap: 14px; justify-items: center;
}
.ig-wrap { width: 100%; max-width: 340px; }
.card-frame {
  position: relative; container-type: inline-size;
  width: 100%; aspect-ratio: 9 / 16;
  border-radius: 18px; overflow: hidden;
  box-shadow: 0 18px 40px -18px rgba(43, 30, 26, .45);
  background: var(--line);
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.card-frame.grab { cursor: grabbing; }
.card-frame canvas { width: 100%; height: 100%; display: block; }

/* Instagram-Ansicht (nur zur Veranschaulichung, nicht im exportierten Bild) */
.ig-av { flex: none; border-radius: 50%; display: inline-block;
  background: radial-gradient(circle, #E2654F 0 50%, #fff 51% 56%, transparent 57%), linear-gradient(135deg, #F9CE34, #EE2A7B, #6228D7); }
.ig-head, .ig-foot, .ig-story { display: none; }
.ig-story { position: absolute; inset: 0; pointer-events: none; color: #fff; font-size: 3.5cqw; line-height: 1.2; }
.ig-wrap.story-mock .ig-story { display: block; }

.mbar { display: none; }

@media (max-width: 860px) {

  function store(read, value) {

  }

  }

    lang: pickLang(),
    format: FORMATS[saved.format] ? saved.format : "story",

  function isSticker() { return !!FORMATS[state.format].sticker; }

  function chipGroup(container, name, items, current, onPick) {

  }
  function buildChips() {

  /* ---------- Format & Rahmen ---------- */

  // Textfarbe: fest gewählt oder passend zur Helligkeit des Vorschaufotos
  function inkKey() {
    if (state.ink !== "auto") return state.ink;
    return state.photo && state.photoLum != null && state.photoLum > 150 ? "dark" : "white";
  }
  function measurePhoto(img) {
    try {
      const c = document.createElement("canvas"); c.width = 18; c.height = 32;
      const x = c.getContext("2d"), ar = img.width / img.height, box = 18 / 32;
      let sw, sh;
      if (ar > box) { sh = img.height; sw = sh * box; } else { sw = img.width; sh = sw / box; }
      x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, 18, 32);
      const d = x.getImageData(2, 4, 14, 24).data; let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      return sum / (d.length / 4);
    } catch (e) { return null; }
  }

  /* ---------- Strick-Typ ---------- */
  function autoType() {
    const fo = num("fo"), wip = num("wip"), ufo = num("ufo"), tests = num("tests");
    if (fo + wip + ufo + tests === 0) return "fresh";
    if (tests >= 3 && tests * 2 >= fo) return "tester";
    if (ufo >= 3 && ufo > fo) return "ufo";
    if (wip >= 5 || (wip >= 3 && wip > fo)) return "juggler";
    if (fo >= 12) return "machine";
    if (fo >= 1 && wip <= 1 && ufo === 0) return "mono";
    return "steady";

  // Designer-Handles säubern: "@" ergänzen, nur gültige Instagram-Zeichen, höchstens drei
  function designers() {
    return $("designer").value.split(/[\s,;]+/)
      .map((h) => h.replace(/^.*instagram\.com\//i, "").replace(/[^A-Za-z0-9._]/g, ""))
      .filter(Boolean).slice(0, 3).map((h) => "@" + h);
  }
  function typeName() {
    if (state.type === "none") return "";

  }

  /* ---------- Zeichen-Helfer ---------- */
  const SANS = "'DM Sans', 'Helvetica Neue', Arial, sans-serif";
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const tt = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((tt - r) * p + r); g = Math.round((tt - g) * p + g); b = Math.round((tt - b) * p + b);
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

    ctx.font = weight + " " + size + "px " + SANS;

  }
  function fitSize(text, weight, start, maxW, min, trackRatio) {
    let s = start;
    for (;;) {
      setFont(weight, s, (trackRatio || 0) * s);
      if (ctx.measureText(text).width <= maxW || s <= min) return s;
      s -= 2;
    }
  }
  function ellipsize(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let s = text;
    while (s.length && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    return s.trimEnd() + "…";

  function wrapLines(text, maxW, maxLines) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = []; let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width <= maxW) { line = test; continue; }
      if (line) lines.push(line);
      line = w;
      if (lines.length === maxLines) break;
    }
    if (line && lines.length < maxLines) lines.push(line);
    if (lines.length === maxLines && words.join(" ") !== lines.join(" ")) {
      let last = lines[maxLines - 1];
      while (last.length && ctx.measureText(last + "…").width > maxW) last = last.slice(0, -1);
      lines[maxLines - 1] = last.trimEnd() + "…";
    }
    return lines.map((l) => ellipsize(l, maxW));
  }

  // Feines Maschenbild (glatt rechts), Ton in Ton
  function knitTexture(x, y, w, h, color) {
    ctx.save();
    ctx.fillStyle = shade(color, -0.22); ctx.fillRect(x, y, w, h);
    const sw = 30, sh = 26;
    ctx.lineCap = "round"; ctx.lineWidth = sw * 0.34;
    const cols = Math.ceil(w / sw) + 2, rows = Math.ceil(h / sh) + 2;
    for (let rI = -1; rI < rows; rI++) {
      for (let c = -1; c < cols; c++) {
        const cx = x + c * sw + sw / 2, cy = y + rI * sh;
        ctx.strokeStyle = shade(color, -0.04);
        ctx.beginPath(); ctx.moveTo(cx - sw * 0.3, cy); ctx.lineTo(cx - 1, cy + sh * 0.78); ctx.stroke();
        ctx.strokeStyle = shade(color, 0.08);
        ctx.beginPath(); ctx.moveTo(cx + sw * 0.3, cy); ctx.lineTo(cx + 1, cy + sh * 0.78); ctx.stroke();
      }
    }
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, "rgba(255,255,255,.08)"); g.addColorStop(1, "rgba(0,0,0,.14)");
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }

  };
  const LOGOS = {};
  Object.keys(LOGO_SRC).forEach((k) => {
    const img = new Image();
    img.onload = () => { LOGOS[k] = img; draw(); };
    img.src = LOGO_SRC[k];
  });

  /* ---------- Karte zeichnen ---------- */
  function drawPhoto(H) {
    const img = state.photo, base = Math.max(W / img.width, H / img.height), sc = base * state.photoZ;
    const dw = img.width * sc, dh = img.height * sc;
    const mx = Math.max(0, (dw - W) / 2), my = Math.max(0, (dh - H) / 2);
    const cx = Math.max(-mx, Math.min(mx, state.photoX * W)), cy = Math.max(-my, Math.min(my, state.photoY * H));
    state.photoX = cx / W; state.photoY = cy / H;
    ctx.drawImage(img, (W - dw) / 2 + cx, (H - dh) / 2 + cy, dw, dh);
  }
  function draw() {
    if (canvas.height !== FORMATS[state.format].h) canvas.height = FORMATS[state.format].h;
    renderCard(false);
    updateFrame();
    $("fallback").hidden = true;
    $("typeHint").textContent = t("typeHint", { type: t("type_" + autoType()) });
    $("sizeHint").textContent = t(state.capped ? "sizeMax" : "sizeHint");
    drawThumb();
    scheduleBlob();
  }
  // forExport: beim Sticker ohne Vorschaufoto zeichnen, damit der Hintergrund transparent bleibt
  function renderCard(forExport) {
    const fmt = FORMATS[state.format], full = !fmt.sticker, H = fmt.h, C = W / 2;
    const panel = !full && state.panel === "on";
    const u = state.size / 100, k = Math.max(1, u); // k: Textbreiten schrumpfen, damit vergrößerte Schrift nicht über den Rand läuft
    const light = full || inkKey() === "white";
    const ink = INKS[light ? "white" : "dark"];
    const knit = LOGOS[light ? "knitLight" : "knitDark"], oo = LOGOS[light ? "ooLight" : "ooDark"];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (full) {
      if (state.photo) {
        drawPhoto(H);
      } else {
        knitTexture(0, 0, W, H, state.color);
      }
      ctx.fillStyle = state.photo ? "rgba(0,0,0,.42)" : "rgba(0,0,0,.34)"; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(C, H / 2, H * 0.2, C, H / 2, H * 0.75);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.25)");

    } else if (state.photo && !forExport) {

    }

    // Inhalt als Stapel von Blöcken: erst messen, dann passend skaliert zeichnen

    } });

    const fav = $("best").value.trim(), des = designers();
    if (fav) {
      const fs = fitSize(fav, "800", 76, 940 / k, 54, -0.02);
      const fl = wrapLines(fav, 940 / k, 2), lh = fs * 1.08;
      blocks.push({ h: 72 + fl.length * lh, gap: des.length ? 20 : 62, draw: (y) => {
        ctx.fillStyle = ink.muted; setFont("700", 40, 0); ctx.fillText(t("cardFav"), 0, y + 40);
        ctx.fillStyle = ink.fg; setFont("800", fs, -0.02 * fs);
        fl.forEach((l, i) => ctx.fillText(l, 0, y + 72 + fs * 0.8 + i * lh));
      } });
    }

    if (des.length) {
      const dl = t("cardDesigner") + " " + des.join(" ");
      const ds = fitSize(dl, "700", 42, 940 / k, 26, 0);
      blocks.push({ h: 52, gap: 62, draw: (y) => {
        ctx.fillStyle = ink.fg; setFont("700", ds, 0); ctx.fillText(ellipsize(dl, 940 / k), 0, y + 40);
      } });
    }

    blocks.push({ h: 54, gap: 56, draw: (y) => {
      ctx.fillStyle = ink.fg; fitSize(CONFIG.hashtag, "800", 48, 940 / k, 30, 0); ctx.fillText(CONFIG.hashtag, 0, y + 44);
    } });

    const KW = 430, KH = KW * 244 / 900, OW = 176, OH = OW * 127 / 640;
    blocks.push({ h: KH, gap: 40, draw: (y) => { if (knit) ctx.drawImage(knit, -KW / 2, y, KW, KH); } });
    blocks.push({ h: OH, gap: 0, draw: (y) => {
      if (oo) { ctx.globalAlpha = 0.92; ctx.drawImage(oo, -OW / 2, y, OW, OH); ctx.globalAlpha = 1; }
    } });

    const sumH = blocks.reduce((a, b) => a + b.h, 0), sumG = blocks.reduce((a, b) => a + b.gap, 0);
    const avail = H - fmt.top - fmt.bottom, natural = sumH + sumG;
    // Größe: unter 100 % einfach verkleinern. Darüber zuerst Platz schaffen, indem die Abstände zwischen den Blöcken
    // bis auf 40 % zusammenrücken, und nur wenn auch das nicht reicht, bleibt die Schrift bei der größten passenden Größe.
    const MING = 0.4;
    let s, g = 1;
    if (u <= 1) {
      s = u * Math.min(1, avail / natural);
    } else if (natural * u <= avail) {
      s = u;
    } else {
      const need = (avail / u - sumH) / sumG;
      if (need >= MING) { s = u; g = need; }
      else { g = MING; s = Math.max(avail / (sumH + MING * sumG), Math.min(1, avail / natural)); }
    }
    state.capped = u > 1 && s < u - 0.001;
    const total = sumH + g * sumG;
    const hh = total * s, yBase = fmt.top + (avail - hh) / 2;
    let cxT = C + state.tx * W, y0 = yBase + state.ty * H;
    cxT = Math.max(W * 0.15, Math.min(W * 0.85, cxT));
    y0 = Math.max(H * 0.08 - hh / 2, Math.min(H * 0.92 - hh / 2, y0));
    state.tx = (cxT - C) / W; state.ty = (y0 - yBase) / H;

    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.translate(cxT, y0); ctx.scale(s, s);
    if (panel) { ctx.fillStyle = ink.panel; { const pw = Math.min(1000, (W - 40) / s); roundRect(-pw / 2, -70, pw, total + 140, 64); }; ctx.fill(); }
    else { ctx.shadowColor = ink.shadow; ctx.shadowBlur = full ? 14 : 18; ctx.shadowOffsetY = 1; }
    let y = 0;
    blocks.forEach((b) => { b.draw(y); y += b.h + b.gap * g; });
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    ctx.restore();

    const pad = panel ? 82 * s : 50;
    state.bounds = full ? null : { top: Math.max(0, Math.floor(y0 - pad)), bottom: Math.min(H, Math.ceil(y0 + total * s + pad)) };
  }

  function drawThumb() {
    const th = $("thumb"), c = th.getContext("2d");
    c.clearRect(0, 0, th.width, th.height);
    if (isSticker()) { c.fillStyle = inkKey() === "dark" ? "#E6E0DB" : "#3B3532"; c.fillRect(0, 0, th.width, th.height); }
    const ar = W / canvas.height, box = th.width / th.height;
    let dw = th.width, dh = th.height;
    if (ar > box) dh = dw / ar; else dw = dh * ar;
    try { c.drawImage(canvas, (th.width - dw) / 2, (th.height - dh) / 2, dw, dh); } catch (e) {}
  }

  /* ---------- Speichern & Teilen ---------- */
  function exportCanvas() {
    if (!isSticker()) return canvas;
    // Sticker: ohne Vorschaufoto neu zeichnen und auf den Inhalt zuschneiden
    const off = document.createElement("canvas"); off.width = W; off.height = FORMATS[state.format].h;
    const keep = ctx; ctx = off.getContext("2d");
    try { renderCard(true); } finally { ctx = keep; }
    const b = state.bounds, out = document.createElement("canvas");
    out.width = W; out.height = Math.round(b.bottom - b.top);
    out.getContext("2d").drawImage(off, 0, b.top, W, out.height, 0, 0, W, out.height);
    return out;
  }
  function makeBlob(cb) {
    const st = isSticker();
    try { exportCanvas().toBlob(cb, st ? "image/png" : "image/jpeg", 0.92); } catch (e) { cb(null); }
  }
  // Bild im Hintergrund vorbereiten, damit das Teilen direkt beim Tippen startet
  let blobTimer = 0;
  function scheduleBlob() {
    const ver = ++state.blobVer; state.blob = null;
    clearTimeout(blobTimer);
    blobTimer = setTimeout(() => makeBlob((b) => { if (ver === state.blobVer) state.blob = b; }), 350);
  }
  function fileName(blob) {
    return t("fileName") + (isSticker() ? "-sticker" : "") + (blob && blob.type === "image/jpeg" ? ".jpg" : ".png");
  }
  function showFallback() {
    const img = $("fallbackImg"), st = isSticker();
    img.src = exportCanvas().toDataURL(st ? "image/png" : "image/jpeg", 0.92);
    img.classList.toggle("checker", st);
    $("fallback").hidden = false;
  }
  function showNext() { $("next").hidden = false; }

  function caption() {
    const best = $("best").value.trim(), wish = $("wish").value.trim(), type = typeName();
    const sk = num("skeins"), fr = num("frogged"), de = state.lang === "de";
    const lines = [];
    lines.push((de ? "Mein Strickjahr " : "My year in knits ") + CONFIG.year + " 🧶");
    lines.push(num("fo") + " FOs · " + num("wip") + " WIPs · " + num("ufo") + " UFOs · " + num("tests") + " Testknits");
    const ex = [];
    if (sk) ex.push(t("cardSkeins", { n: sk }));
    if (fr) ex.push(t("cardFrogged", { n: fr }) + " 🐸");
    if (ex.length) lines.push(ex.join(de ? " und " : " and "));
    if (type) lines.push((de ? "Strick-Typ: " : "Knitter type: ") + type);
    if (best) lines.push(t("cardFav") + ": " + best);
    if (designers().length) lines.push(t("capDesigner") + designers().join(" ") + " 💛");
    if (wish) lines.push((de ? "Und 2027 kommt endlich: " : "And in 2027, finally: ") + wish + " ✨");
    lines.push("");
    lines.push(de
      ? "Mach deine eigene Karte im Knitplace von " + CONFIG.handle + " und gewinn Garn für dein Wunschprojekt."
      : "Make your own card at Knitplace by " + CONFIG.handle + " and win yarn for your dream project.");
    lines.push(CONFIG.hashtag + (de
      ? " #knitplace #oonique #strickjahr" + CONFIG.year + " #stricken #strickenmachtglücklich"
      : " #knitplace #oonique #yearinknits #knittersofinstagram #knitting"));
    return lines.join("\n");
  }

  function copyText(text, okMsg, silent) {
    const fallback = () => {
      const ta = $("captionSrc"); ta.value = text; ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (!silent) setStatus(ok ? okMsg : t("stSelect"));
    };
    try {
      navigator.clipboard.writeText(text).then(() => { if (!silent) setStatus(okMsg); }, fallback);
    } catch (e) { fallback(); }
  }

  function download(blob) {
    try {
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = fileName(blob); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setStatus(t("stSaved"));
      if (isTouch) showFallback();
    } catch (e) { showFallback(); setStatus(t("stReady")); }
    showNext();
  }

  function withBlob(fn) {
    if (state.blob) { fn(state.blob); return; }
    setStatus(t("stPreparing"));
    makeBlob((blob) => {
      if (!blob) { showFallback(); showNext(); setStatus(t("stReady")); return; }
      fn(blob);
    });
  }

  const ACTIONS = {
    share: () => withBlob((blob) => {
      copyText(caption(), "", true); // Caption liegt beim Posten schon in der Zwischenablage
      const file = new File([blob], fileName(blob), { type: blob.type });
      let can = false;
      try { can = isTouch && !!navigator.canShare && navigator.canShare({ files: [file] }); } catch (e) {}
      if (!can) { download(blob); return; }
      navigator.share({ files: [file] }).then(
        () => { setStatus(t("stShared")); showNext(); },
        (err) => { if (err && err.name === "AbortError") { setStatus(""); return; } download(blob); }
      );
    }),
    save: () => withBlob(download),
    copyCaption: () => copyText(caption(), t("stCaption")),
    copyTag: () => copyText(CONFIG.hashtag, t("stTag")),
    challenge: () => {
      const url = shareUrl(), text = t("challengeText");
      if (isTouch && navigator.share) {
        navigator.share({ text: text, url: url }).catch(() => {});
      } else { copyText(text + " " + url, t("stLink")); }
    },
    toPreview: () => { $("preview").scrollIntoView({ behavior: "smooth", block: "start" }); }
  };
  document.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest("[data-act]");
    if (btn && ACTIONS[btn.dataset.act]) ACTIONS[btn.dataset.act]();
  });

  function shareUrl() {
    if (CONFIG.shareUrl) return CONFIG.shareUrl;
    const q = params.get("share");
    if (q && /^https?:\/\//i.test(q)) return q;
    if (embedded && document.referrer) return document.referrer;
    return location.origin + location.pathname;
  }

  /* ---------- Merken & Aktualisieren ---------- */
  function persist() {
    const data = { lang: state.lang, format: state.format, type: state.type, color: state.color, ink: state.ink, panel: state.panel, size: state.size, mock: state.mock };
    NUM_FIELDS.forEach((f) => { data[f.id] = num(f.id); });
    TEXT_FIELDS.forEach((id) => { data[id] = $(id).value; });
    store(false, data);
  }
  function onInput() { persist(); updateMock(); draw(); }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function updateZoomOut() { $("zoomOut").textContent = Math.round(state.photoZ * 100) + " %"; }
  function setSize(v) { state.size = clamp(Math.round(v), 50, 200); sizeEl.value = String(state.size); updateSizeOut(); }
  function setZoom(v) { state.photoZ = clamp(v, 1, 4); $("pzoom").value = String(Math.round(state.photoZ * 100)); updateZoomOut(); }
  let rafId = 0;
  function requestDraw() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = 0; draw(); }); }

  function updateMock() {
    const on = state.mock === "on", w = $("igwrap");
    w.classList.toggle("story-mock", on && state.format !== "post");
    w.classList.toggle("post-mock", on && state.format === "post");
    $("mockToggle").checked = on;
    const name = $("handle").value.trim().replace(/^@/, "") || t("igName");
    document.querySelectorAll("[data-ig-name]").forEach((el) => { el.textContent = name; });
    $("igCap").textContent = (state.lang === "de" ? "Mein Strickjahr " : "My year in knits ") + CONFIG.year + " 🧶 " + CONFIG.hashtag;
  }
  function syncEdit() {
    document.querySelectorAll("button[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    $("editHint").textContent = t(state.mode === "text" ? "editHint_text" : "editHint_photo");
    $("frame").setAttribute("aria-label", t("canvasLabel") + ": " + t(state.mode === "text" ? "modeText" : "modePhoto"));
  }
  document.querySelectorAll("button[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; syncEdit(); }));
  $("mockToggle").addEventListener("change", (e) => { state.mock = e.target.checked ? "on" : "off"; persist(); updateMock(); });
  function resetEdit() {
    state.tx = 0; state.ty = 0; state.photoX = 0; state.photoY = 0; setZoom(1); setSize(100);
    persist(); draw();
  }
  $("resetEdit").addEventListener("click", resetEdit);
  $("pzoom").addEventListener("input", (e) => { setZoom((parseInt(e.target.value, 10) || 100) / 100); requestDraw(); });

  function pts() { return Array.from(ptrs.values()); }
  function startGesture() {
    const p = pts(); if (!p.length) { gest = null; return; }
    const mx = p.reduce((a, q) => a + q.x, 0) / p.length, my = p.reduce((a, q) => a + q.y, 0) / p.length;
    gest = { mx: mx, my: my, d: p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0, size: state.size, z: state.photoZ };
  }
  frameEl.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    try { frameEl.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    startGesture(); frameEl.classList.add("grab"); e.preventDefault();
  });
  frameEl.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId) || !gest) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = pts(), mx = p.reduce((a, q) => a + q.x, 0) / p.length, my = p.reduce((a, q) => a + q.y, 0) / p.length;
    const k = W / frameEl.getBoundingClientRect().width, dx = (mx - gest.mx) * k, dy = (my - gest.my) * k;
    gest.mx = mx; gest.my = my;
    const f = p.length > 1 && gest.d > 0 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) / gest.d : 1;
    if (state.mode === "text") {
      state.tx += dx / W; state.ty += dy / canvas.height;
      if (p.length > 1) setSize(gest.size * f);
    } else if (state.photo) {
      state.photoX += dx / W; state.photoY += dy / canvas.height;
      if (p.length > 1) setZoom(gest.z * f);
    }
    requestDraw();
  });
  function endPtr(e) {
    if (!ptrs.delete(e.pointerId)) return;
    startGesture();
    if (!ptrs.size) { frameEl.classList.remove("grab"); persist(); }
  }
  frameEl.addEventListener("pointerup", endPtr);
  frameEl.addEventListener("pointercancel", endPtr);
  frameEl.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return; // normales Scrollen bleibt erhalten, Pinch auf dem Trackpad kommt als Strg + Wheel
    e.preventDefault();
    const f = Math.exp(-e.deltaY * 0.01);
    if (state.mode === "text") setSize(state.size * f); else if (state.photo) setZoom(state.photoZ * f);
    persist(); requestDraw();
  }, { passive: false });
  frameEl.addEventListener("keydown", (e) => {
    const st = e.shiftKey ? 0.05 : 0.01, mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (mv) {
      if (state.mode === "text") { state.tx += mv[0] * st; state.ty += mv[1] * st; } else { state.photoX += mv[0] * st; state.photoY += mv[1] * st; }
    } else if (e.key === "+" || e.key === "=" || e.key === "-") {
      const f = e.key === "-" ? 1 / 1.1 : 1.1;
      if (state.mode === "text") setSize(state.size * f); else if (state.photo) setZoom(state.photoZ * f);
    } else return;
    e.preventDefault(); persist(); requestDraw();
  });

  // Beispielfoto (WIP) als Standard-Hintergrund, bis ein eigenes Foto gewählt wird
  (function () {
    const img = new Image();
    img.onload = () => {
      state.demoImg = img;
      if (state.photo) return;
      state.photo = img; state.photoLum = measurePhoto(img);
      syncPhotoUi(); updateFrame(); draw();
    };
    img.src = WIP_SRC;
  })();
  updateZoomOut();

  // Hinweis, wenn die Seite in einer App-Ansicht (z. B. Knitplace-App, Instagram-Browser) läuft
  (function () {
    const ua = navigator.userAgent || "";
    const inApp = !!window.ReactNativeWebView || /; wv\)|FBAN|FBAV|Instagram/i.test(ua) || (/iPhone|iPad/.test(ua) && !/Safari/.test(ua));
    if (!inApp) return;
    $("appHint").hidden = false;
    $("pageUrl").textContent = location.href;
    $("copyLink").addEventListener("click", () => {
      try {
        navigator.clipboard.writeText(location.href).then(() => { $("copyLink").textContent = t("copied"); }, () => {});
      } catch (e) {}
    });
  })();

  // Seitenlogo passend zu Hell/Dunkel
  (function () {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const setLogo = () => {
      const th = document.documentElement.getAttribute("data-theme");
      const dark = th ? th === "dark" : mq.matches;
      $("pageLogo").src = dark ? LOGO_SRC.knitLight : LOGO_SRC.knitDark;
    };
    setLogo();
    try { mq.addEventListener("change", setLogo); } catch (e) {}
    new MutationObserver(setLogo).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  })();

  // Eingebettet: Höhe an die einbettende Seite melden, damit das iframe mitwächst
  if (embedded) {
    let lastH = 0;
    const post = () => {
      const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h === lastH) return;
      lastH = h;
      try { window.parent.postMessage({ type: "oonique2026myknits:height", height: h }, "*"); } catch (e) {}
    };
    if ("ResizeObserver" in window) new ResizeObserver(post).observe(document.documentElement);
    window.addEventListener("load", post);
    post();
  }

  // Start. Nochmal zeichnen, sobald die Schriften da sind
  applyLang();
  draw();
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("800 40px 'DM Sans'"),
      document.fonts.load("700 40px 'DM Sans'")
    ]).then(draw, draw);
  }
})();
</script>

</body>
</html>
